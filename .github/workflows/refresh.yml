name: Refresh gallery from Flickr

# Flickr is the source of truth. This rebuilds the static site from
# Flickr and commits only if something changed (new/edited photos or
# albums). Runs weekly and on demand — note the VSCO lesson from the
# main site: scraping a consumer site from datacenter IPs gets
# blocked; Flickr's official API does not have that problem.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * 1" # Mondays ~14:17 UTC

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild from Flickr
        env:
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
        run: python3 tools/build.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes from Flickr — nothing to publish."
          else
            git commit -m "Refresh gallery from Flickr"
            git push
          fi
